name: ✨ Özellik isteği
description: Yeni bir özellik veya iyileştirme önerin
title: "[Öneri] "
labels: ["öneri"]
body:
  - type: markdown
    attributes:
      value: |
        Fikirlerinizi önce [oblifex.com](https://oblifex.com) forumunda toplulukla tartışmanızı öneririz.
  - type: textarea
    id: sorun
    attributes:
      label: Hangi ihtiyacı karşılıyor?
      description: Bu özellik olmadan yaşadığınız sorunu anlatın.
    validations:
      required: true
  - type: textarea
    id: oneri
    attributes:
      label: Önerdiğiniz çözüm
    validations:
      required: true
  - type: textarea
    id: alternatif
    attributes:
      label: Düşündüğünüz alternatifler
